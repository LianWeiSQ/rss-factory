name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g., v1.1.0)'
        required: true
        type: string

jobs:
  create-release:
    name: Create Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.get_version.outputs.version }}
      tag: ${{ steps.get_version.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Get version from input
        id: get_version
        run: |
          VERSION="${{ github.event.inputs.version }}"
          # Remove 'v' prefix if present
          VERSION="${VERSION#v}"
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag=v$VERSION" >> $GITHUB_OUTPUT

          # Check if this is a pre-release (alpha or beta)
          # Match versions like 1.2.3-alpha, 1.2.3-alpha.1, 1.2.3-beta, 1.2.3-beta.2
          if [[ "$VERSION" =~ -(alpha|beta)($|\.) ]]; then
            echo "is_prerelease=true" >> $GITHUB_OUTPUT
            echo "This is a pre-release version: $VERSION"
          else
            echo "is_prerelease=false" >> $GITHUB_OUTPUT
            echo "This is a stable release version: $VERSION"
          fi

      - name: Check if tag exists
        id: check_tag
        run: |
          git fetch --tags
          if git rev-parse ${{ steps.get_version.outputs.tag }} >/dev/null 2>&1; then
            echo "tag_exists=true" >> $GITHUB_OUTPUT
            echo "Tag ${{ steps.get_version.outputs.tag }} already exists"
          else
            echo "tag_exists=false" >> $GITHUB_OUTPUT
            echo "Tag ${{ steps.get_version.outputs.tag }} does not exist"
          fi

      - name: Create Git tag
        if: steps.check_tag.outputs.tag_exists == 'false'
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git commit -m "Release ${{ steps.get_version.outputs.tag }}" || echo "No changes to commit"
          git tag ${{ steps.get_version.outputs.tag }}
          git push origin ${{ steps.get_version.outputs.tag }}
          git push origin HEAD:${{ github.ref_name }}

      - name: Set up Node.js for release notes
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Generate changelog
        id: changelog
        run: |
          VERSION="${{ steps.get_version.outputs.version }}"

          node scripts/release-notes.mjs "$VERSION"

          # Show what we extracted for debugging
          echo "=== Generated Release Notes ==="
          cat RELEASE_NOTES.md
          echo "==============================="

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.get_version.outputs.tag }}
          name: CSS Factory ${{ steps.get_version.outputs.tag }}
          body_path: RELEASE_NOTES.md
          draft: false
          prerelease: ${{ steps.get_version.outputs.is_prerelease == 'true' }}
          make_latest: ${{ steps.get_version.outputs.is_prerelease == 'false' }}
          token: ${{ secrets.GITHUB_TOKEN }}

  package-skills:
    name: Package Skills
    needs: create-release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.create-release.outputs.tag }}

      - name: Validate generated skill API reference
        run: |
          python skills/css-factory-assistant/scripts/generate_api_reference.py docs/SERVER_MODE/swagger.json skills/css-factory-assistant/references/api.md
          git diff --exit-code skills/css-factory-assistant/references/api.md

      - name: Package CSS Factory skills
        run: |
          VERSION="${{ needs.create-release.outputs.version }}"
          mkdir -p build/skills
          cd skills
          zip -r "../build/skills/CSSFactory-${VERSION}-skills.zip" css-factory-assistant
          cd ..
          unzip -t "build/skills/CSSFactory-${VERSION}-skills.zip"

      - name: Upload Skills Release Asset
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.create-release.outputs.tag }}
          files: build/skills/CSSFactory-${{ needs.create-release.outputs.version }}-skills.zip
          token: ${{ secrets.GITHUB_TOKEN }}

  build-release:
    name: Build ${{ matrix.platform }}-${{ matrix.arch }}
    needs: create-release
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # Desktop platforms - always build
          # Linux AMD64 build
          - os: ubuntu-24.04
            platform: linux
            arch: amd64
            ext: ''
            build_condition: 'true'
          # Linux ARM64 build - using native ARM64 runner
          - os: ubuntu-24.04-arm
            platform: linux
            arch: arm64
            ext: ''
            build_condition: 'true'
          # Windows AMD64 build
          - os: windows-latest
            platform: windows
            arch: amd64
            ext: '.exe'
            build_condition: 'true'
          # Windows ARM64 build - using native ARM64 runner
          - os: windows-11-arm
            platform: windows
            arch: arm64
            ext: '.exe'
            build_condition: 'true'
          # macOS Universal build (includes both Intel and Apple Silicon)
          - os: macos-latest
            platform: darwin
            arch: universal
            ext: '.app'
            build_condition: 'true'

          # Experimental mobile scaffolding; no supported mobile release pipeline yet.
          # Keep disabled until the bridge, signing, and device CI are implemented.
          # - os: macos-latest
          #   platform: ios
          #   arch: arm64
          #   ext: '.ipa'
          #   build_condition: 'wails_v3_only'
          # - os: ubuntu-24.04
          #   platform: android
          #   arch: arm64
          #   ext: '.apk'
          #   build_condition: 'wails_v3_only'

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.create-release.outputs.tag }}

      - name: Check if artifacts already exist
        id: check_artifacts
        shell: bash
        run: |
          # Get release info and check for existing assets
          TAG="${{ needs.create-release.outputs.tag }}"
          VERSION="${{ needs.create-release.outputs.version }}"

          # Determine expected artifact names for this platform/arch
          if [ "${{ matrix.platform }}" = "windows" ]; then
            INSTALLER="CSSFactory-${VERSION}-windows-${{ matrix.arch }}-installer.exe"
            PACKAGE=""  # No package for Windows
          elif [ "${{ matrix.platform }}" = "linux" ]; then
            INSTALLER="CSSFactory-${VERSION}-linux-${{ matrix.arch }}.AppImage"
            PACKAGE="CSSFactory-${VERSION}-linux-${{ matrix.arch }}.tar.gz"
          elif [ "${{ matrix.platform }}" = "darwin" ]; then
            INSTALLER="CSSFactory-${VERSION}-darwin-${{ matrix.arch }}.dmg"
            PACKAGE=""  # No package for macOS
          elif [ "${{ matrix.platform }}" = "ios" ]; then
            INSTALLER="CSSFactory-${VERSION}-ios-${{ matrix.arch }}.ipa"
            PACKAGE=""  # No package for iOS
          elif [ "${{ matrix.platform }}" = "android" ]; then
            INSTALLER="CSSFactory-${VERSION}-android-${{ matrix.arch }}.apk"
            PACKAGE=""  # No package for Android
          fi

          # Check if release has these assets
          RELEASE_JSON=$(curl -s -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            "https://api.github.com/repos/${{ github.repository }}/releases/tags/${TAG}")

          ASSETS=$(echo "$RELEASE_JSON" | jq -r '.assets[].name')

          echo "Checking for existing assets..."
          echo "Expected installer: $INSTALLER"
          if [ -n "$PACKAGE" ]; then
            echo "Expected package: $PACKAGE"
          fi
          echo "Found assets:"
          echo "$ASSETS"

          # Check if any of our artifacts exist
          SKIP_BUILD="false"
          if echo "$ASSETS" | grep -q "$INSTALLER"; then
            echo "Installer for ${{ matrix.platform }}-${{ matrix.arch }} already exists in release"
            SKIP_BUILD="true"
          elif [ -n "$PACKAGE" ] && echo "$ASSETS" | grep -q "$PACKAGE"; then
            echo "Package for ${{ matrix.platform }}-${{ matrix.arch }} already exists in release"
            SKIP_BUILD="true"
          fi

          echo "skip_build=$SKIP_BUILD" >> $GITHUB_OUTPUT

          if [ "$SKIP_BUILD" = "true" ]; then
            echo "⏭️  Skipping build for ${{ matrix.platform }}-${{ matrix.arch }} (already exists)"
          else
            echo "✅ Proceeding with build for ${{ matrix.platform }}-${{ matrix.arch }}"
          fi

      - name: Set up Go
        if: steps.check_artifacts.outputs.skip_build == 'false'
        uses: actions/setup-go@v7
        with:
          go-version: '1.27'

      - name: Set up Node.js
        if: steps.check_artifacts.outputs.skip_build == 'false'
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Install Task (task runner)
        if: steps.check_artifacts.outputs.skip_build == 'false'
        uses: arduino/setup-task@v3
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Linux dependencies (AMD64)
        if: steps.check_artifacts.outputs.skip_build == 'false' && matrix.platform == 'linux' && matrix.arch == 'amd64'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-4-dev \
            libwebkitgtk-6.0-dev \
            libsoup-3.0-dev \
            gcc \
            pkg-config \
            wget \
            file

          # Verify GTK4/WebKitGTK 6.0 are available for current Wails v3
          pkg-config --modversion gtk4 || exit 1
          pkg-config --modversion webkitgtk-6.0 || exit 1
          echo "GTK4 and WebKitGTK 6.0 installed successfully for Wails v3"

      - name: Install Linux dependencies (ARM64)
        if: steps.check_artifacts.outputs.skip_build == 'false' && matrix.platform == 'linux' && matrix.arch == 'arm64'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-4-dev \
            libwebkitgtk-6.0-dev \
            libsoup-3.0-dev \
            gcc \
            pkg-config \
            wget \
            file

          # Verify GTK4/WebKitGTK 6.0 are available for current Wails v3
          pkg-config --modversion gtk4 || exit 1
          pkg-config --modversion webkitgtk-6.0 || exit 1
          echo "GTK4 and WebKitGTK 6.0 installed successfully for Wails v3 ARM64"

      - name: Install Windows dependencies (AMD64)
        if: steps.check_artifacts.outputs.skip_build == 'false' && matrix.platform == 'windows' && matrix.arch == 'amd64'
        run: |
          choco install mingw nsis -y
        shell: pwsh

      - name: Install Windows dependencies (ARM64)
        if: steps.check_artifacts.outputs.skip_build == 'false' && matrix.platform == 'windows' && matrix.arch == 'arm64'
        run: |
          choco install mingw nsis -y
          # MinGW is required for CGO
        shell: pwsh

      - name: Install Wails CLI
        if: steps.check_artifacts.outputs.skip_build == 'false'
        shell: bash
        run: |
          WAILS_VERSION=$(go list -m -f '{{.Version}}' github.com/wailsapp/wails/v3)
          echo "Installing Wails CLI ${WAILS_VERSION}"
          go install github.com/wailsapp/wails/v3/cmd/wails3@${WAILS_VERSION}

      - name: Install frontend dependencies
        if: steps.check_artifacts.outputs.skip_build == 'false'
        working-directory: ./frontend
        run: npm ci

      - name: Build application (Linux)
        if: steps.check_artifacts.outputs.skip_build == 'false' && matrix.platform == 'linux'
        env:
          CGO_ENABLED: 1
          ARCH: ${{ matrix.arch }}
        run: |
          # wails3 build via Taskfile automatically handles frontend build
          task linux:build

          # Verify the build
          if [ ! -f "build/bin/CSSFactory" ]; then
            echo "Error: Binary not found"
            exit 1
          fi

          # Check architecture
          file build/bin/CSSFactory
          echo "Binary built successfully for ${{ matrix.arch }}"

      - name: Build application (Windows)
        if: steps.check_artifacts.outputs.skip_build == 'false' && matrix.platform == 'windows'
        shell: pwsh
        env:
          CGO_ENABLED: 1
          ARCH: ${{ matrix.arch }}
        run: |
          # wails3 build via Taskfile automatically handles frontend build
          task windows:build

          # Verify the build
          if (-not (Test-Path "build/bin/CSSFactory.exe")) {
            Write-Error "Binary not created"
            exit 1
          }

          Write-Host "Binary built successfully for ${{ matrix.arch }}"

      - name: Build application (macOS)
        if: steps.check_artifacts.outputs.skip_build == 'false' && matrix.platform == 'darwin'
        env:
          CGO_ENABLED: 1
          ARCH: ${{ matrix.arch }}
        run: |
          # macOS runners can build universal binaries natively
          # wails3 build via Taskfile automatically handles frontend build
          task darwin:build

      - name: Create installer (Windows)
        if: steps.check_artifacts.outputs.skip_build == 'false' && matrix.platform == 'windows'
        run: |
          # Find NSIS installation
          $nsisPath = Get-Command makensis -ErrorAction SilentlyContinue
          if (-not $nsisPath) {
            # Try common installation paths
            $possiblePaths = @(
              "C:\Program Files (x86)\NSIS\makensis.exe",
              "C:\Program Files\NSIS\makensis.exe"
            )
            foreach ($path in $possiblePaths) {
              if (Test-Path $path) {
                $nsisPath = $path
                break
              }
            }
          } else {
            $nsisPath = $nsisPath.Source
          }

          if (-not $nsisPath) {
            Write-Error "NSIS not found"
            exit 1
          }

          Write-Host "Using NSIS at: $nsisPath"

          # Update version and architecture in installer script
          $version = "${{ needs.create-release.outputs.version }}"
          $arch = "${{ matrix.arch }}"
          $installerPath = "build/windows/installer.nsi"

          if (Test-Path $installerPath) {
            $content = Get-Content $installerPath -Raw
            $content = $content -replace '!define APP_VERSION ".*"', "!define APP_VERSION `"$version`""
            $content = $content -replace 'OutFile ".*"', "OutFile `"..\bin\CSSFactory-$version-windows-$arch-installer.exe`""
            Set-Content $installerPath $content

            # Build NSIS installer
            & $nsisPath $installerPath

            if ($LASTEXITCODE -ne 0) {
              Write-Error "NSIS build failed with exit code $LASTEXITCODE"
              exit 1
            }
          } else {
            Write-Warning "Installer script not found at $installerPath"
            exit 1
          }
        shell: pwsh
        continue-on-error: true

      - name: Create portable package (Windows)
        if: steps.check_artifacts.outputs.skip_build == 'false' && matrix.platform == 'windows'
        run: |
          $version = "${{ needs.create-release.outputs.version }}"
          $arch = "${{ matrix.arch }}"
          $portableDir = "build/portable-temp"

          # Create portable directory structure
          New-Item -ItemType Directory -Force -Path $portableDir | Out-Null

          # Copy executable
          Copy-Item "build/bin/CSSFactory.exe" -Destination $portableDir

          # Create portable.txt marker
          New-Item -ItemType File -Path "$portableDir/portable.txt" | Out-Null

          # Create README for portable version
          @"
          CSSFactory Portable Edition

          This is the portable version of CSSFactory. All data will be stored in the 'data' folder
          next to this executable.

          To run: Double-click CSSFactory.exe

          For more information, visit: https://github.com/LianWeiSQ/rss-factory
          "@ | Out-File -FilePath "$portableDir/README.txt" -Encoding UTF8

          # Create zip file
          $zipName = "CSSFactory-$version-windows-$arch-portable.zip"
          Compress-Archive -Path "$portableDir/*" -DestinationPath "build/bin/$zipName" -Force

          Write-Host "Created portable package: $zipName"
        shell: pwsh

      - name: Create installer (Linux)
        if: steps.check_artifacts.outputs.skip_build == 'false' && matrix.platform == 'linux'
        run: |
          # Clean up any cached appimagetool to ensure correct architecture is downloaded
          rm -f build/appimagetool-*.AppImage

          # Debug: Show system architecture info
          echo "System architecture: $(uname -m)"
          echo "Target architecture: ${{ matrix.arch }}"

          # Debug: Verify binary architecture
          echo "Binary architecture check:"
          file build/bin/CSSFactory || true

          chmod +x build/linux/create-appimage.sh
          ARCH=${{ matrix.arch }} ./build/linux/create-appimage.sh || echo "AppImage creation failed, will use tar.gz"
        continue-on-error: true

      - name: Create installer (macOS)
        if: steps.check_artifacts.outputs.skip_build == 'false' && matrix.platform == 'darwin'
        run: |
          codesign --deep --force --verify --verbose \
            --sign - \
            --entitlements build/darwin/entitlements.plist \
            build/bin/CSSFactory.app
          codesign --verify --deep --strict --verbose=2 build/bin/CSSFactory.app
          chmod +x build/darwin/create-dmg.sh
          ./build/darwin/create-dmg.sh

      - name: Create portable package (macOS)
        if: steps.check_artifacts.outputs.skip_build == 'false' && matrix.platform == 'darwin'
        run: |
          VERSION="${{ needs.create-release.outputs.version }}"
          ARCH="${{ matrix.arch }}"
          PORTABLE_DIR="build/portable-temp"

          # Create portable directory structure
          mkdir -p "$PORTABLE_DIR"

          # Copy .app bundle
          cp -R build/bin/CSSFactory.app "$PORTABLE_DIR/"

          # Create portable.txt marker
          touch "$PORTABLE_DIR/portable.txt"

          # Create README for portable version
          cat > "$PORTABLE_DIR/README.txt" << 'EOF'
          CSSFactory Portable Edition

          This is the portable version of CSSFactory. All data will be stored in the 'data' folder
          next to the CSSFactory.app.

          To run: Double-click CSSFactory.app

          For more information, visit: https://github.com/LianWeiSQ/rss-factory
          EOF

          # Create zip file
          cd "$PORTABLE_DIR"
          zip -r "../bin/CSSFactory-${VERSION}-darwin-${ARCH}-portable.zip" *
          cd ../..

          echo "Created portable package: CSSFactory-${VERSION}-darwin-${ARCH}-portable.zip"

      - name: Package application (Linux - tar.gz fallback)
        if: steps.check_artifacts.outputs.skip_build == 'false' && matrix.platform == 'linux'
        run: |
          cd build/bin
          if [ -f "CSSFactory" ]; then
            tar -czf CSSFactory-${{ needs.create-release.outputs.version }}-linux-${{ matrix.arch }}.tar.gz CSSFactory
          else
            echo "Error: CSSFactory binary not found"
            exit 1
          fi

      - name: Create portable package (Linux)
        if: steps.check_artifacts.outputs.skip_build == 'false' && matrix.platform == 'linux'
        run: |
          VERSION="${{ needs.create-release.outputs.version }}"
          ARCH="${{ matrix.arch }}"
          PORTABLE_DIR="build/portable-temp"

          # Create portable directory structure
          mkdir -p "$PORTABLE_DIR"

          # Copy executable
          cp build/bin/CSSFactory "$PORTABLE_DIR/"
          chmod +x "$PORTABLE_DIR/CSSFactory"

          # Create portable.txt marker
          touch "$PORTABLE_DIR/portable.txt"

          # Create README for portable version
          cat > "$PORTABLE_DIR/README.txt" << 'EOF'
          CSSFactory Portable Edition

          This is the portable version of CSSFactory. All data will be stored in the 'data' folder
          next to this executable.

          To run: ./CSSFactory

          For more information, visit: https://github.com/LianWeiSQ/rss-factory
          EOF

          # Create tar.gz file
          cd "$PORTABLE_DIR"
          tar -czf "../bin/CSSFactory-${VERSION}-linux-${ARCH}-portable.tar.gz" *
          cd ../..

          echo "Created portable package: CSSFactory-${VERSION}-linux-${ARCH}-portable.tar.gz"

      - name: Collect artifacts
        if: steps.check_artifacts.outputs.skip_build == 'false'
        id: collect_artifacts
        shell: bash
        run: |
          cd build/bin
          artifacts=""

          # Check for installer and portable package
          if [ "${{ matrix.platform }}" = "windows" ]; then
            installer="CSSFactory-${{ needs.create-release.outputs.version }}-windows-${{ matrix.arch }}-installer.exe"
            portable="CSSFactory-${{ needs.create-release.outputs.version }}-windows-${{ matrix.arch }}-portable.zip"
            if [ -f "$installer" ]; then
              artifacts="$artifacts$installer,"
            fi
            if [ -f "$portable" ]; then
              artifacts="$artifacts$portable,"
            fi
          elif [ "${{ matrix.platform }}" = "linux" ]; then
            installer="CSSFactory-${{ needs.create-release.outputs.version }}-linux-${{ matrix.arch }}.AppImage"
            portable="CSSFactory-${{ needs.create-release.outputs.version }}-linux-${{ matrix.arch }}-portable.tar.gz"
            if [ -f "$installer" ]; then
              artifacts="$artifacts$installer,"
            fi
            # Check for tar.gz fallback
            package="CSSFactory-${{ needs.create-release.outputs.version }}-linux-${{ matrix.arch }}.tar.gz"
            if [ -f "$package" ]; then
              artifacts="$artifacts$package,"
            fi
            if [ -f "$portable" ]; then
              artifacts="$artifacts$portable,"
            fi
          elif [ "${{ matrix.platform }}" = "darwin" ]; then
            installer="CSSFactory-${{ needs.create-release.outputs.version }}-darwin-${{ matrix.arch }}.dmg"
            portable="CSSFactory-${{ needs.create-release.outputs.version }}-darwin-${{ matrix.arch }}-portable.zip"
            if [ -f "$installer" ]; then
              artifacts="$artifacts$installer,"
            fi
            if [ -f "$portable" ]; then
              artifacts="$artifacts$portable,"
            fi
          fi

          echo "artifacts=$artifacts" >> $GITHUB_OUTPUT
          echo "Found artifacts: $artifacts"

      - name: Upload Release Assets
        if: steps.check_artifacts.outputs.skip_build == 'false'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.create-release.outputs.tag }}
          files: |
            build/bin/CSSFactory-${{ needs.create-release.outputs.version }}-*
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_on_unmatched_files: false
